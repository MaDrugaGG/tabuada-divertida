<!DOCTYPE html>
<html lang="pt-BR" data-theme="cosmos">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a24">
    <meta name="description" content="Tabuada Divertida: aprenda matemática jogando. Treino inteligente, jogos em 3D, trilhas e ferramentas do dia a dia. Criado por David Duarte.">
    <meta name="author" content="David Duarte">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Tabuada Divertida</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preload" href="assets/fonts/baloo-2-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/nunito-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <div id="splash">
        <div class="logo">
            <svg width="150" height="150" viewBox="0 0 120 120" aria-hidden="true">
                <defs>
                    <radialGradient id="spB" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#c4b5fd"/><stop offset=".55" stop-color="#7c5cff"/><stop offset="1" stop-color="#4c2fd0"/></radialGradient>
                </defs>
                <ellipse cx="60" cy="113" rx="28" ry="4.5" fill="rgba(0,0,0,.25)"/>
                <path d="M60 30 Q57 21 62 13" stroke="#5b3be6" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M62 4.5l1.9 4 4.4.6-3.2 3 .8 4.4-3.9-2.1-3.9 2.1.8-4.4-3.2-3 4.4-.6z" fill="#fde047" stroke="#f59e0b" stroke-width="1"/>
                <ellipse cx="23" cy="76" rx="8" ry="12.5" fill="#5b3be6" transform="rotate(24 23 76)"/>
                <ellipse cx="97" cy="76" rx="8" ry="12.5" fill="#5b3be6" transform="rotate(-24 97 76)"/>
                <circle cx="60" cy="68" r="40" fill="url(#spB)"/>
                <ellipse cx="45" cy="45" rx="14" ry="7.5" fill="rgba(255,255,255,.38)" transform="rotate(-28 45 45)"/>
                <ellipse cx="46.5" cy="62" rx="9.5" ry="11.5" fill="#fff"/><ellipse cx="73.5" cy="62" rx="9.5" ry="11.5" fill="#fff"/>
                <circle cx="48" cy="64.5" r="5.6" fill="#1b1446"/><circle cx="72" cy="64.5" r="5.6" fill="#1b1446"/>
                <circle cx="50" cy="61.5" r="2.2" fill="#fff"/><circle cx="74" cy="61.5" r="2.2" fill="#fff"/>
                <circle cx="35" cy="77" r="5.5" fill="#ff8fc0" opacity=".65"/><circle cx="85" cy="77" r="5.5" fill="#ff8fc0" opacity=".65"/>
                <path d="M47 75 Q60 96 73 75 Z" fill="#1b1446"/>
            </svg>
            <h1>Tabuada <span>Divertida</span></h1>
            <p>por David Duarte</p>
        </div>
    </div>

    <div id="app">
        <header id="topbar"></header>
        <main id="screens"></main>
        <nav id="tabbar" class="hidden" aria-label="Navegação principal">
            <button class="tab" data-act="tab" data-arg="home"><span class="dot hidden" id="tabDotHome"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.8 9.8v9.7h12.4V9.8"/><path d="M10 19.5v-5h4v5"/></svg>Início</button>
            <button class="tab" data-act="tab" data-arg="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6M9 11h4"/></svg>Aprender</button>
            <button class="tab" data-act="tab" data-arg="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7.5 10.3v4.4M5.3 12.5h4.4"/><path d="M15.4 11.3h.01M18 13.8h.01"/></svg>Jogos</button>
            <button class="tab" data-act="tab" data-arg="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="3.2"/><rect x="8" y="5.5" width="8" height="4" rx="1"/><path d="M8.6 13.2h.01M12 13.2h.01M15.4 13.2h.01M8.6 17h.01M12 17h.01M15.4 17h.01"/></svg>Ferramentas</button>
            <button class="tab" data-act="tab" data-arg="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
        </nav>
    </div>

    <!-- Espaço reservado do banner do rodapé (AdMob) -->
    <div id="adDock" aria-hidden="true">
        <div class="ad-label">Publicidade</div>
        <div class="ad-house" id="adHouse"></div>
    </div>
    <div id="safeBottomFill"></div>

    <script src="assets/js/core.js"></script>
    <script src="assets/js/ads.js"></script>
    <script src="assets/js/learn.js"></script>
    <script src="assets/js/games.js"></script>
    <script src="assets/js/games3d.js"></script>
    <script src="assets/js/tools.js"></script>
    <script src="assets/js/profile.js"></script>
    <script src="assets/js/home.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
